# ===========================================================================
# Xavfsizlik tekshiruvlari: har push, PR va har hafta.
#   * gitleaks  — butun git tarixida maxfiy kalit/token qidirish
#   * pip-audit — kutubxonalardagi ma'lum zaifliklar (CVE)
#   * bandit    — Python kodidagi xavfli naqshlar (SAST)
#   * tests     — to'liq test to'plami (xavfsizlik testlari ham shu yerda)
# CodeQL alohida: codeql.yml. Kutubxona yangilanishlari: dependabot.yml.
# ===========================================================================
name: security

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "41 3 * * 1"     # har dushanba
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Maxfiy kalitlar (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # butun tarix
      - name: Install gitleaks (checksum tekshiriladi)
        env:
          VERSION: 8.24.2
          SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
        run: |
          curl -fsSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
      - name: Scan git history
        run: /tmp/gitleaks git . --redact --no-banner --exit-code 1
      - name: Scan working tree
        run: /tmp/gitleaks dir . --redact --no-banner --exit-code 1

  dependencies:
    name: Kutubxonalar (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --progress-spinner off

  sast:
    name: Kod tahlili (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r api bot services db scripts config.py main.py -ll

  tests:
    name: Testlar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -p no:warnings
