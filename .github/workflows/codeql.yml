# CodeQL: Python, JavaScript (Mini App ichidagi inline skriptlar) va
# GitHub Actions workflow'larini xavfsizlik zaifliklariga tahlil qilish.
# Natijalar: Security -> Code scanning.
name: codeql

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "17 4 * * 3"     # har chorshanba
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
